[workspace]
members = [
    "crates/liveforge-core",
    "crates/liveforge-media",
    "crates/liveforge-metadata",
    "crates/liveforge-validator",
    "crates/liveforge-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Vcab3011/LiveForge"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
